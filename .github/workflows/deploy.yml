name: 더현대 팝업 레이더 — 일일 수집 & GitHub Pages 배포

# 평일 아침 08:49 KST = UTC 23:49
on:
  schedule:
    - cron: "30 22 * * 0-4"
  workflow_dispatch: {} # 수동 실행(테스트용)

permissions:
  contents: write # 다음날 Diff 용 스냅샷 커밋
  pages: write # GitHub Pages 배포
  id-token: write # Pages OIDC

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  collect-build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 체크아웃
        uses: actions/checkout@v4

      - name: Go 1.22+ 셋업
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: 수집 & 사이트 빌드
        run: |
          go run main.go
          echo "## 📣 더현대 팝업 레이더 수집 및 빌드 완료" >> "$GITHUB_STEP_SUMMARY"

      - name: 스냅샷 커밋 — 내일 Diff 기준 보존
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "스냅샷 변경 없음"
          else
            git commit -m "snapshot: $(TZ=Asia/Seoul date +%F)"
            git push
          fi

      - name: Pages 설정
        uses: actions/configure-pages@v5

      - name: out/ 업로드
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

      - name: GitHub Pages 배포
        id: deployment
        uses: actions/deploy-pages@v4
