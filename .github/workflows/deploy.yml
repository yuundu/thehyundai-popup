name: 더현대 팝업 레이더 — 일일 수집 & GitHub Pages 배포

# 평일 아침 08:49 KST = UTC 23:49 (KST = UTC+9, 서머타임 없음)
on:
  schedule:
    - cron: "49 23 * * 1-5"
  workflow_dispatch: {} # 수동 실행(테스트용)

permissions:
  contents: write # 다음날 Diff 용 스냅샷 커밋
  pages: write # GitHub Pages 배포
  id-token: write # Pages OIDC

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  collect-build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 체크아웃
        uses: actions/checkout@v4

      - name: Go 1.22+ 세업
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: 수집 & 사이트 빌드 (go run main.go)
        run: |
          go run main.go
          echo "## 📣 더현대 팝업 레이더 · 오늘 변동" >> "$GITHUB_STEP_SUMMARY"
          if [ -f data/changes-*.json ]; then
            python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
import glob, json
for f in glob.glob("data/changes-*.json"):
    d = json.load(open(f))
    ch = d.get("changes", [])
    if not ch:
        print("- 변동 없음")
    for c in ch:
        print(f"- {c['message']}")
PY
          fi

      - name: 스냅샷 커밋 — 내일 Diff 기준 보존
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "스냅샷 변경 없음"
          else
            git commit -m "snapshot: $(TZ=Asia/Seoul date +%F)"
            git push
          fi

      - name: Pages 설정
        uses: actions/configure-pages@v5

      - name: out/ 업로드
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

      - name: GitHub Pages 배포
        id: deployment
        uses: actions/deploy-pages@v4
